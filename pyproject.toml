[tool.poetry]
package-mode = false
name = "devops-telegram-assistant"
version = "0.1.0"
description = "Telegram assistant bot with DevOps deployment"
authors = ["Vasyl Radashev <vasiliyradashev24@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.4"
python-dotenv = "^1.2.2"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
