[tool.poetry]
package-mode = false
name = "devops-telegram-assistant"
version = "0.1.0"
description = "Telegram assistant bot with DevOps deployment"
authors = ["Vasyl Radashev <vasiliyradashev24@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
aiogram = "^3.4"
python-dotenv = "^1.2.2"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.48"
asyncpg = "^0.31.0"
alembic = "^1.18.4"
pydantic-settings = "^2.13.1"
aiohttp = "^3.13.5"
google-api-python-client = "^2.193.0"
google-auth = "^2.49.1"
google-auth-oauthlib = "^1.3.1"
openai = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
