services:
  api:
    build: .
    command:  poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    restart: always

  bot:
    build: .
    command: python -m app.bot.main
    env_file:
      - .env
    depends_on:
      - api
      - postgres
    restart: always

  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - assistant_postgres_data_v1:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    restart: always

volumes:
  assistant_postgres_data_v1:
